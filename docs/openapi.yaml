"info":
  "description": "mymac 的本地 HTTP 接口。服务只监听回环地址，每个请求都要通过 Host、Origin 与 Sec-Fetch-Site 三道检查。"
  "license":
    "name": "MIT"
  "title": "mymac"
  "version": "0.1.0"
"openapi": "3.0.3"
"paths":
  "/api/apps":
    "get":
      "description": "返回已安装的应用。体积较小的应用需要后台测量，pending 是还没量完的数量。"
      "operationId": "listApps"
      "parameters":
        - "description": "为 1 时重新扫描"
          "example": 0
          "in": "query"
          "name": "rescan"
          "schema":
            "type": "integer"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/api.AppListResponse"
          "description": "应用列表"
        "default":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/api.ErrorResponse"
          "description": "请求失败时的通用错误"
      "summary": "已安装应用"
      "tags":
        - "apps"
  "/api/apps/icon":
    "get":
      "description": "按 bundle id 返回应用图标。只有扫描到的应用才会被返回。"
      "operationId": "getAppIcon"
      "parameters":
        - "description": "应用的 bundle id"
          "example": "com.apple.Safari"
          "in": "query"
          "name": "id"
          "required": true
