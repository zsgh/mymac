      "summary": "启用或禁用接口文档"
      "tags":
        - "settings"
  "/api/settings/test":
    "post":
      "description": "问模型一句小话，确认接口地址、密钥和模型名是对的。"
      "operationId": "testLLM"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/api.SettingsTestResponse"
          "description": "测试结果"
        "default":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/api.ErrorResponse"
          "description": "请求失败时的通用错误"
      "summary": "测试大模型"
      "tags":
        - "settings"
  "/api/system/overview":
    "get":
      "description": "返回 CPU、内存、磁盘、网络与电池的汇总。"
      "operationId": "getSystemOverview"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/sysinfo.Overview"
          "description": "系统概览"
        "default":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/api.ErrorResponse"
          "description": "请求失败时的通用错误"
      "summary": "系统概览"
      "tags":
        - "procs"
  "/api/trash/status":
    "get":
      "description": "探测 Finder 自动化是否可用。不可用时只能退回 rm。"
      "operationId": "getTrashStatus"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/trash.Status"
          "description": "废纸篓状态"
        "default":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/api.ErrorResponse"
          "description": "请求失败时的通用错误"
      "summary": "废纸篓可用性"
      "tags":
        - "apps"
